<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.35">
  <!-- Statue of Freedom on top -->
  <path d="M300 30 L300 55 M295 40 L305 40" stroke-width="3" />
  <circle cx="300" cy="24" r="5" fill="#38BDF8" />
  
  <!-- Lantern and Tholos -->
  <path d="M288 65 L312 65 L310 95 L290 95 Z" fill="rgba(56,189,248,0.08)" />
  <line x1="282" y1="95" x2="318" y2="95" stroke-width="3" />
  <line x1="285" y1="75" x2="315" y2="75" />
  <line x1="294" y1="65" x2="294" y2="95" />
  <line x1="300" y1="65" x2="300" y2="95" />
  <line x1="306" y1="65" x2="306" y2="95" />

  <!-- Outer Dome Shell / Ribs -->
  <path d="M250 240 C250 135 285 95 300 95 C315 95 350 135 350 240 Z" fill="rgba(56,189,248,0.04)" stroke-width="3" />
  <!-- Dome Rib lines -->
  <path d="M265 240 C265 155 288 115 300 95" />
  <path d="M335 240 C335 155 312 115 300 95" />
  <path d="M280 240 C280 170 294 130 300 95" />
  <path d="M320 240 C320 170 306 130 300 95" />
  <line x1="300" y1="95" x2="300" y2="240" />

  <!-- Dome Horizontal Rings / Windows -->
  <path d="M256 160 Q300 152 344 160" />
  <path d="M251 200 Q300 190 349 200" />
  <circle cx="300" cy="130" r="4" fill="#38BDF8" />
  <circle cx="282" cy="140" r="3" />
  <circle cx="318" cy="140" r="3" />
  <circle cx="270" cy="180" r="4" />
  <circle cx="300" cy="175" r="5" />
  <circle cx="330" cy="180" r="4" />

  <!-- Drum Attic / Upper Balustrade -->
  <rect x="242" y="240" width="116" height="24" rx="2" fill="rgba(56,189,248,0.06)" stroke-width="2.5" />
  <!-- Attic Windows / Panels -->
  <line x1="255" y1="240" x2="255" y2="264" />
  <line x1="270" y1="240" x2="270" y2="264" />
  <line x1="285" y1="240" x2="285" y2="264" />
  <line x1="300" y1="240" x2="300" y2="264" />
  <line x1="315" y1="240" x2="315" y2="264" />
  <line x1="330" y1="240" x2="330" y2="264" />
  <line x1="345" y1="240" x2="345" y2="264" />

  <!-- Colonnade Drum (Peristyle of 36 columns) -->
  <rect x="220" y="264" width="160" height="90" fill="rgba(56,189,248,0.03)" stroke-width="3" />
  <!-- Columns -->
  <line x1="230" y1="264" x2="230" y2="354" stroke-width="2" />
  <line x1="242" y1="264" x2="242" y2="354" stroke-width="2" />
  <line x1="254" y1="264" x2="254" y2="354" stroke-width="2" />
  <line x1="266" y1="264" x2="266" y2="354" stroke-width="2" />
  <line x1="278" y1="264" x2="278" y2="354" stroke-width="2" />
  <line x1="290" y1="264" x2="290" y2="354" stroke-width="2" />
  <line x1="302" y1="264" x2="302" y2="354" stroke-width="2" />
  <line x1="314" y1="264" x2="314" y2="354" stroke-width="2" />
  <line x1="326" y1="264" x2="326" y2="354" stroke-width="2" />
  <line x1="338" y1="264" x2="338" y2="354" stroke-width="2" />
  <line x1="350" y1="264" x2="350" y2="354" stroke-width="2" />
  <line x1="362" y1="264" x2="362" y2="354" stroke-width="2" />
  <line x1="374" y1="264" x2="374" y2="354" stroke-width="2" />

  <!-- Column Capitals and Architraves -->
  <line x1="216" y1="274" x2="384" y2="274" />
  <line x1="216" y1="344" x2="384" y2="344" />

  <!-- Main Base / Stylobate & Cornice -->
  <rect x="200" y="354" width="200" height="30" fill="rgba(56,189,248,0.06)" stroke-width="3" />
  <line x1="180" y1="384" x2="420" y2="384" stroke-width="3.5" />

  <!-- Lower Drum / Substructure -->
  <rect x="170" y="384" width="260" height="70" fill="rgba(56,189,248,0.02)" stroke-width="2.5" />
  <!-- Arch Windows in Lower Base -->
  <path d="M210 430 A 15 15 0 0 1 240 430 L240 454 L210 454 Z" />
  <path d="M260 425 A 15 15 0 0 1 290 425 L290 454 L260 454 Z" />
  <path d="M310 425 A 15 15 0 0 1 340 425 L340 454 L310 454 Z" />
  <path d="M360 430 A 15 15 0 0 1 390 430 L390 454 L360 454 Z" />

  <!-- Grand Portico & Pediment Wings -->
  <path d="M100 484 L300 454 L500 484 Z" fill="rgba(56,189,248,0.05)" stroke-width="3" />
  <line x1="70" y1="484" x2="530" y2="484" stroke-width="4" />

  <!-- Portico Columns -->
  <g stroke-width="2">
    <line x1="120" y1="484" x2="120" y2="600" />
    <line x1="150" y1="484" x2="150" y2="600" />
    <line x1="180" y1="484" x2="180" y2="600" />
    <line x1="210" y1="484" x2="210" y2="600" />
    <line x1="240" y1="484" x2="240" y2="600" />
    <line x1="270" y1="484" x2="270" y2="600" />
    <line x1="300" y1="484" x2="300" y2="600" />
    <line x1="330" y1="484" x2="330" y2="600" />
    <line x1="360" y1="484" x2="360" y2="600" />
    <line x1="390" y1="484" x2="390" y2="600" />
    <line x1="420" y1="484" x2="420" y2="600" />
    <line x1="450" y1="484" x2="450" y2="600" />
    <line x1="480" y1="484" x2="480" y2="600" />
  </g>

  <!-- Grand Steps -->
  <line x1="50" y1="600" x2="550" y2="600" stroke-width="3" />
  <line x1="30" y1="615" x2="570" y2="615" stroke-width="2" />
  <line x1="10" y1="630" x2="590" y2="630" stroke-width="2" />
  <line x1="0" y1="645" x2="600" y2="645" stroke-width="2.5" />
</svg>
